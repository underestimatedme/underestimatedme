<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 10" width="1200" height="10" role="presentation">
  <defs>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E97"/>
      <stop offset="0.5" stop-color="#B026FF"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="g" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="4" width="1200" height="2" fill="url(#n)" filter="url(#g)"/>
  <g fill="url(#n)">
    <rect x="0" y="0" width="3" height="10"/>
    <rect x="298" y="1" width="2" height="8"/>
    <rect x="599" y="0" width="3" height="10"/>
    <rect x="900" y="1" width="2" height="8"/>
    <rect x="1197" y="0" width="3" height="10"/>
  </g>
</svg>
